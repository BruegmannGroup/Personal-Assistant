name = "momentum-dashboard-worker"
main = "src/index.ts"
compatibility_date = "2026-09-08"
account_id = "ccda4bb40ec77a1929126c6f50623fa2"
workers_dev = true

# Custom domain. *.workers.dev is blocked on some networks (it gets abused for
# phishing, so filtering appliances block the whole zone), which makes the
# dashboard unreachable from those networks. A normal subdomain of a company
# domain is not filtered, and it also survives a workers.dev subdomain rename.
#
# Requires bruegmann-group.com to be an active zone on this Cloudflare account.
# `wrangler deploy` then creates the custom domain and its DNS record for you.
# workers_dev stays true during the switchover; turn it off once the custom
# domain is confirmed working and every caller has been moved across.
# DISABLED: bruegmann-group.com is not a zone on this Cloudflare account (the
# account has no domains at all), so wrangler cannot create this custom domain
# and `deploy` fails with a "could not find zone" error. Re-enable only once a
# domain is actually added to this account.
# routes = [
#   { pattern = "momentum.bruegmann-group.com", custom_domain = true }
# ]

# Serves the built React dashboard (dashboard-web/dist) from this same Worker.
# /api/* and /cron/* hit the script; everything else falls through to the SPA.
[assets]
directory = "../dashboard-web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/cron/*"]

# Not secret — same IDs already in smartsheet_config.json. Safe to commit.
[vars]
ENCOUNTER_SHEET_ID = "3782427792068484"
THREAD_SHEET_ID = "4656101717921668"
GEMINI_MODEL = "gemini-3.5-flash-lite"

# Cloudflare Access. ACCESS_AUD is the "Application Audience (AUD) Tag" of the
# "Momentum Dashboard" application — copy it from Zero Trust and paste it here.
ACCESS_TEAM_DOMAIN = "steep-moon-1fac.cloudflareaccess.com"
# Both Access applications that cover this hostname, comma-separated.
ACCESS_AUD = "bb4c7ca6e7119b25022b10ac212ca4476fe310ccf5ac097986e0f0255e1cb9e3,09203af7430f5c06cd24e629210d44092dd3b7e8a1b888d512b6a029986fe5aa"

# Create once with: npx wrangler r2 bucket create momentum-dashboard-audio
[[r2_buckets]]
binding = "AUDIO_BUCKET"
bucket_name = "momentum-dashboard-audio"

