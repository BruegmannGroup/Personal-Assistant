name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "dashboard-web/**"
      - ".github/workflows/deploy-dashboard.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard-web/package-lock.json

      - name: Install dependencies
        working-directory: dashboard-web
        run: npm ci

      - name: Build
        working-directory: dashboard-web
        env:
          # Set this as a repo Variable (Settings -> Secrets and variables -> Actions ->
          # Variables) to the URL `wrangler deploy` printed for worker/.
          VITE_WORKER_URL: ${{ vars.VITE_WORKER_URL }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard-web/dist

      - id: deployment
        uses: actions/deploy-pages@v4
